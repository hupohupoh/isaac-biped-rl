[project]
name = "isaaclab-dev"
version = "0.1.0"
description = "Isaac Lab source checkout development environment."
requires-python = ">=3.12,<3.13"
dependencies = [
    # ----- workspace members (editable) -----
    "isaaclab",
    "isaaclab-assets",
    "isaaclab-contrib",
    "isaaclab-experimental",
    "isaaclab-newton",
    "isaaclab-ov",
    "isaaclab-ovphysx",
    "isaaclab-physx",
    "isaaclab-ppisp",
    "isaaclab-rl",
    "isaaclab-tasks",
    "isaaclab-tasks-experimental",
    "isaaclab-visualizers",
    # ----- generic -----
    "numpy>=2",
    "torch>=2.11",
    "torchvision>=0.26.0",
    "torchaudio>=2.11",
    "onnx>=1.18.0",
    "prettytable>=3.3.0",
    "protobuf>=4.25.8,!=5.26.0",
    "hidapi>=0.14.0",
    "gymnasium>=1.2.0",
    "trimesh",
    "pyglet>=2.1.6,<3",
    "pytetwild==0.2.3 ; platform_machine in 'x86_64 AMD64'",
    "transformers==4.57.6",
    "einops",
    "warp-lang==1.15.0.dev20260626",
    "matplotlib>=3.10.3",
    "pillow==12.1.1",
    "botocore",
    "starlette>=0.46.0,<0.50",
    "omniverseclient==2.71.1.7015",
    "filelock",
    "lazy_loader>=0.4",
    "pin ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    "pin-pink==3.1.0 ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    "daqp==0.8.5 ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    "usd-core>=25.11,<26.0 ; platform_machine in 'x86_64 AMD64'",
    "usd-exchange>=2.2 ; platform_machine in 'aarch64 arm64'",
    "hf-xet>=1.4.1,<2.0.0 ; platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    # ----- tasks -----
    "tensorboard",
    "numba>=0.63.1",
    # ----- rl utilities -----
    "hydra-core",
    "h5py>=3.15.0",
    "moviepy",
    "packaging",
    "tqdm>=4.67.1",
    "rsl-rl-lib==5.4.1",
    "onnxscript>=0.5",
    # ----- newton -----
    "newton[sim]>=1.2.0",
    "newton-usd-schemas>=0.2.0",
    "PyOpenGL-accelerate>=3.1.0",
    "imgui-bundle>=1.92.5",
    "typing-extensions>=4.12.2",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "junitparser",
    "flatdict>=4.1.0",
    "flaky",
    "coverage>=7.6.1",
]
sb3 = ["stable-baselines3>=2.6", "tqdm", "rich"]
skrl = ["skrl>=2.1.0"]
rl-games = [
    "aiohttp>=3.12.14",
    "rl-games @ git+https://github.com/isaac-sim/rl_games.git@python3.11",
    "gym",
    "standard-distutils",
]
rsl-rl = ["rsl-rl-lib==5.4.1", "onnxscript>=0.5"]
viser = ["viser>=1.0.16"]
rerun = ["rerun-sdk>=0.29.0", "pyarrow==22.0.0"]
isaacsim = ["isaacsim[all,extscache]==6.0.0.1"]
ov = ["ovphysx==0.5.2+head.f62c22207c"]
rtx = ["ovrtx>=0.3.0,<0.4.0"]
mimic = [
    "isaaclab-mimic",
    "ipywidgets>=8.1.5",
    "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git@v0.4.0 ; sys_platform == 'linux'",
]
teleop = [
    "isaaclab-teleop",
    "isaacteleop[retargeters,ui,cloudxr]~=1.3.0 ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64'",
    "dex-retargeting==0.5.0 ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64'",
]
rlinf = [
    "ray[default]>=2.47.0",
    "av>=12.3.0",
    "numpydantic>=1.7.0",
    "albumentations>=1.4.18",
    "decord2",
    "dm_tree>=0.1.8",
    "diffusers>=0.35.0",
    "timm>=1.0.14",
    "peft>=0.17.0",
    "pandas",
]
all = ["isaaclab-dev[sb3,skrl,rl-games,rsl-rl,rerun,rlinf,mimic]"]

[tool.isaaclab.versions]
isaacsim = "6.0.0.1"
torch = "2.11.0"
torchvision = "0.26.0"
torchaudio = "2.11.0"
ovphysx = "0.5.2+head.f62c22207c"
ovrtx = ">=0.3.0,<0.4.0"
newton = "c7ae7c7648cd0717df39e5c94b95d5a02c997320"
warp = "1.15.0.dev20260626"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["logs", "_isaac_sim", ".vscode", "_*", ".git"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C90", "SIM", "RET"]
ignore = [
    "E402", "D401", "RET504", "RET505", "SIM102", "SIM103",
    "SIM108", "SIM117", "SIM118", "UP006", "UP018",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
section-order = [
    "future", "standard-library", "third-party",
    "omniverse-extensions", "isaaclab", "isaaclab-contrib",
    "isaaclab-rl", "isaaclab-mimic", "isaaclab-tasks",
    "isaaclab-assets", "first-party", "local-folder",
]

[tool.ruff.lint.isort.sections]
"omniverse-extensions" = ["isaacsim", "omni", "pxr", "carb", "usdrt", "Semantics", "curobo"]
"isaaclab" = ["isaaclab"]
"isaaclab-assets" = ["isaaclab_assets"]
"isaaclab-contrib" = ["isaaclab_contrib"]
"isaaclab-rl" = ["isaaclab_rl"]
"isaaclab-mimic" = ["isaaclab_mimic"]
"isaaclab-tasks" = ["isaaclab_tasks"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["source", "scripts"]
exclude = ["**/__pycache__", "**/_isaac_sim", "**/docs", "**/logs", ".git", ".vscode"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportGeneralTypeIssues = "none"
reportOptionalMemberAccess = "warning"
reportPrivateUsage = "warning"

[tool.codespell]
skip = '*.usd,*.usda,*.usdz,*.svg,*.png,_isaac_sim*,*.bib,*.css,*/_build'
quiet-level = 0
ignore-words-list = "haa,slq,collapsable,buss,reacher,thirdparty,segway"

[tool.pytest.ini_options]
markers = [
    "isaacsim_ci: mark test to run in isaacsim ci",
    "device_split: re-invoke this file once per device (CPU and GPU)",
    "windows_ci: mark test to run on Windows platforms in CI",
    "arm_ci: mark test to run on ARM platforms in CI",
    "unit: test exercises isolated logic and does not launch the simulator",
    "integration: test drives the simulator/scene/environment end-to-end",
    "benchmark: test covers the Isaac Lab benchmark framework and infrastructure",
    "rendering: test exercises the rendering / camera / visualizer pipeline",
    "smoke: tests for core installation, task, and RL functionality",
]

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
override-dependencies = [
    "numpy>=2",
    "newton[sim] @ git+https://github.com/newton-physics/newton.git@c7ae7c7648cd0717df39e5c94b95d5a02c997320",
    "newton-usd-schemas>=0.3.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
]
conflicts = [
    [{ extra = "teleop" }, { extra = "mimic" }],
    [{ extra = "teleop" }, { extra = "all" }],
    [{ extra = "isaacsim" }, { extra = "teleop" }],
    [{ extra = "isaacsim" }, { extra = "ov" }],
    [{ extra = "isaacsim" }, { extra = "viser" }],
    [{ extra = "isaacsim" }, { extra = "mimic" }],
    [{ extra = "isaacsim" }, { extra = "all" }],
    [{ extra = "isaacsim" }, { extra = "test" }],
]
python-preference = "only-managed"
package = false

[tool.uv.sources]
isaaclab = { path = "source/isaaclab", editable = true }
"isaaclab-assets" = { path = "source/isaaclab_assets", editable = true }
"isaaclab-contrib" = { path = "source/isaaclab_contrib", editable = true }
"isaaclab-experimental" = { path = "source/isaaclab_experimental", editable = true }
"isaaclab-mimic" = { path = "source/isaaclab_mimic", editable = true }
"isaaclab-newton" = { path = "source/isaaclab_newton", editable = true }
"isaaclab-ov" = { path = "source/isaaclab_ov", editable = true }
"isaaclab-ovphysx" = { path = "source/isaaclab_ovphysx", editable = true }
"isaaclab-physx" = { path = "source/isaaclab_physx", editable = true }
"isaaclab-ppisp" = { path = "source/isaaclab_ppisp", editable = true }
"isaaclab-rl" = { path = "source/isaaclab_rl", editable = true }
"isaaclab-tasks" = { path = "source/isaaclab_tasks", editable = true }
"isaaclab-tasks-experimental" = { path = "source/isaaclab_tasks_experimental", editable = true }
"isaaclab-teleop" = { path = "source/isaaclab_teleop", editable = true }
"isaaclab-visualizers" = { path = "source/isaaclab_visualizers", editable = true }
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'AMD64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'arm64'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'AMD64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'arm64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'AMD64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'arm64'" },
]

[tool.uv.pip]
index-strategy = "unsafe-best-match"
prerelease = "allow"
